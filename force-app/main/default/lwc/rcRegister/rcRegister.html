<template>
  <div class="rc-container page">
    <div class="rc-card auth">
      <p class="rc-eyebrow">Customers</p>
      <h1 class="rc-display title">Create your account</h1>
      <p class="rc-text">
        Request door-to-door pickups and follow all your shipments in one place.
      </p>
      <form class="form" onsubmit={handleSubmit} novalidate>
        <c-rc-segmented
          name="customerType"
          label="I am"
          options={customerTypeOptions}
          value={form.customerType}
          onchange={handleChange}
        ></c-rc-segmented>
        <lightning-input
          label={accountNameLabel}
          name="accountName"
          value={form.accountName}
          max-length="255"
          autocomplete="organization"
          required
          onchange={handleChange}
        ></lightning-input>
        <div class="rc-grid">
          <lightning-input
            label="Contact first name"
            name="firstName"
            value={form.firstName}
            max-length="40"
            autocomplete="given-name"
            required
            onchange={handleChange}
          ></lightning-input>
          <lightning-input
            label="Contact last name"
            name="lastName"
            value={form.lastName}
            max-length="80"
            autocomplete="family-name"
            required
            onchange={handleChange}
          ></lightning-input>
        </div>
        <lightning-input
          type="email"
          label="Email"
          name="email"
          value={form.email}
          max-length="60"
          autocomplete="email"
          required
          onchange={handleChange}
        ></lightning-input>
        <lightning-input
          type="tel"
          label="Phone"
          name="phone"
          value={form.phone}
          pattern={phonePattern}
          message-when-pattern-mismatch="Enter a phone number with at least 10 digits."
          autocomplete="tel"
          required
          onchange={handleChange}
        ></lightning-input>
        <lightning-input
          class="password"
          type="password"
          label="Password"
          name="password"
          value={form.password}
          field-level-help="At least 10 characters, with letters and numbers."
          autocomplete="new-password"
          required
          onchange={handleChange}
        ></lightning-input>
        <lightning-input
          class="confirm"
          type="password"
          label="Confirm password"
          name="confirmPassword"
          value={form.confirmPassword}
          autocomplete="new-password"
          required
          onchange={handleChange}
        ></lightning-input>
        <template lwc:if={errorMessage}>
          <div class="rc-alert rc-alert_error" role="alert">
            {errorMessage}
            <template lwc:if={isDuplicate}>
              <span class="dup-links">
                <a class="rc-link" href={loginUrl}>Log in</a> ·
                <a class="rc-link" href={forgotUrl}>Reset password</a>
              </span>
            </template>
          </div>
        </template>
        <button
          class="rc-button rc-button_block"
          type="submit"
          disabled={isBusy}
        >
          Create account
        </button>
      </form>
      <p class="rc-text links">
        Already have an account? <a class="rc-link" href={loginUrl}>Log in</a>
      </p>
    </div>
  </div>
</template>
