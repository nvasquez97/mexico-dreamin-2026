<template>
    <div class="rc-container rc-auth">
        <p class="rc-kicker">Customers</p>
        <h1 class="rc-title">Reset your password</h1>
        <form class="rc-card" onsubmit={handleSubmit} novalidate>
            <p>Enter the email of your account. We will send you a link to reset your password.</p>
            <div class="rc-field">
                <label class="rc-label" for="email">Email</label>
                <input id="email" class="rc-input" type="email" autocomplete="email" value={email} oninput={handleEmail} required />
            </div>
            <div aria-live="polite">
                <template lwc:if={errorText}><p class="rc-message rc-message_error" role="alert">{errorText}</p></template>
                <template lwc:if={successText}><p class="rc-message rc-message_success">{successText}</p></template>
            </div>
            <div class="rc-actions">
                <button class="rc-button" type="submit" disabled={loading}>Send reset link</button>
            </div>
        </form>
        <p><a class="rc-link" href={loginUrl}>Back to log in</a></p>
    </div>
</template>
