<template>
  <section class="rc-auth" aria-labelledby="rc-forgot-title">
    <h2 id="rc-forgot-title" class="rc-auth__title">Forgot your password?</h2>
    <p class="rc-auth__hint">
      Enter the email of your account. If it is registered, we will send you a
      link to choose a new password.
    </p>
    <form
      data-id="form"
      class="rc-auth__form"
      novalidate
      onsubmit={handleSubmit}
    >
      <div class="rc-auth__field">
        <label class="rc-auth__label" for="email">Email</label>
        <input
          id="email"
          data-field="email"
          class="rc-auth__input"
          type="email"
          autocomplete="email"
          aria-invalid={invalid.email}
          aria-describedby="email-error"
        />
        <p id="email-error" data-error="email" class="rc-auth__error">
          {errors.email}
        </p>
      </div>

      <p data-id="form-error" class="rc-auth__alert" role="alert">
        {formError}
      </p>

      <button
        data-id="submit"
        class="rc-auth__submit"
        type="submit"
        disabled={isLoading}
      >
        {submitLabel}
      </button>
    </form>
    <p class="rc-auth__footer">
      <a data-id="login-link" class="rc-auth__link" href={loginUrl}
        >Back to log in</a
      >
    </p>
  </section>
</template>
