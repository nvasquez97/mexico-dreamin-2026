<template>
  <div class="rc-container page">
    <div class="rc-card auth">
      <p class="rc-eyebrow">Customers</p>
      <h1 class="rc-display title">Reset password</h1>
      <template lwc:if={sent}>
        <div class="rc-alert rc-alert_success" role="status">{message}</div>
        <p class="rc-text">
          <a class="rc-link" href={loginUrl}>Back to log in</a>
        </p>
      </template>
      <template lwc:else>
        <p class="rc-text">
          Enter the email you signed up with and we will send you a link to
          reset your password.
        </p>
        <form class="form" onsubmit={handleSubmit} novalidate>
          <lightning-input
            type="email"
            label="Email"
            name="email"
            value={email}
            autocomplete="username"
            required
            onchange={handleChange}
          ></lightning-input>
          <template lwc:if={errorMessage}>
            <div class="rc-alert rc-alert_error" role="alert">
              {errorMessage}
            </div>
          </template>
          <button
            class="rc-button rc-button_block"
            type="submit"
            disabled={isBusy}
          >
            Send reset link
          </button>
        </form>
        <p class="rc-text links">
          <a class="rc-link" href={loginUrl}>Back to log in</a>
        </p>
      </template>
    </div>
  </div>
</template>
