<template>
  <div class="rc-header" data-font={fontState}>
    <a class="rc-header__brand" href={homeUrl}>
      <!-- Narrow screens: the isotype on its electric-blue tile. Wider
           screens: the full negative logo, 440 px wide for at least 360 px of
           visible artwork. CSS shows one at a time. -->
      <img
        class="rc-header__isotype"
        src={isotypeUrl}
        alt="Coffee Blazers Summit"
        width="800"
        height="760"
      />
      <img
        class="rc-header__logo"
        src={logoUrl}
        alt="Coffee Blazers Summit"
        width="1460"
        height="770"
      />
    </a>
    <nav class="rc-header__nav" aria-label="Main">
      <ul class="rc-header__list">
        <li class="rc-header__item">
          <a class="rc-header__link" href={homeUrl}>Track</a>
        </li>
        <template lwc:if={isCustomer}>
          <li class="rc-header__item">
            <a class="rc-header__link" href={myShipmentsUrl}>My shipments</a>
          </li>
          <li class="rc-header__item">
            <a class="rc-header__link" href={requestShipmentUrl}
              >Request a shipment</a
            >
          </li>
        </template>
      </ul>
    </nav>
    <nav class="rc-header__account" aria-label="Account">
      <ul class="rc-header__list">
        <template lwc:if={isGuest}>
          <li class="rc-header__item">
            <a class="rc-header__link" href={loginUrl}>Log in</a>
          </li>
          <li class="rc-header__item">
            <a class="rc-header__link" href={signUpUrl}>Sign up</a>
          </li>
        </template>
        <template lwc:else>
          <li class="rc-header__item">
            <a class="rc-header__link" href={logoutUrl}>Log out</a>
          </li>
        </template>
      </ul>
    </nav>
  </div>
</template>
