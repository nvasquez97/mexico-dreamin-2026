<template>
  <section class="rc-auth" aria-labelledby="rc-login-title">
    <h2 id="rc-login-title" class="rc-auth__title">Log in</h2>
    <form
      data-id="form"
      class="rc-auth__form"
      novalidate
      onsubmit={handleSubmit}
    >
      <div class="rc-auth__field">
        <label class="rc-auth__label" for="email">Email</label>
        <input
          id="email"
          data-field="email"
          class="rc-auth__input"
          type="email"
          autocomplete="email"
          aria-invalid={invalid.email}
          aria-describedby="email-error"
        />
        <p id="email-error" data-error="email" class="rc-auth__error">
          {errors.email}
        </p>
      </div>

      <div class="rc-auth__field">
        <label class="rc-auth__label" for="password">Password</label>
        <input
          id="password"
          data-field="password"
          class="rc-auth__input"
          type="password"
          autocomplete="current-password"
          aria-invalid={invalid.password}
          aria-describedby="password-error"
        />
        <p id="password-error" data-error="password" class="rc-auth__error">
          {errors.password}
        </p>
      </div>

      <p data-id="form-error" class="rc-auth__alert" role="alert">
        {formError}
      </p>

      <button
        data-id="submit"
        class="rc-auth__submit"
        type="submit"
        disabled={isLoading}
      >
        {submitLabel}
      </button>
    </form>
    <p class="rc-auth__footer">
      <a data-id="forgot-link" class="rc-auth__link" href={forgotPasswordUrl}
        >Forgot your password?</a
      >
    </p>
    <p class="rc-auth__footer">
      New customer?
      <a data-id="sign-up-link" class="rc-auth__link" href={signUpUrl}
        >Sign up</a
      >
    </p>
  </section>
</template>
